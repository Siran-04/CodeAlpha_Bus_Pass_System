<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bus Pass System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Student Bus Pass System</h1>
        <p>Apply for your bus pass online</p>

        <form>
            <label>Student Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>College Name</label>
            <input type="text" placeholder="Enter your college name" required>

            <label>From</label>
            <input type="text" placeholder="Starting place" required>

            <label>To</label>
            <input type="text" placeholder="Destination" required>

            <label>Pass Type</label>
            <select required>
                <option value="">Select pass type</option>
                <option>Monthly</option>
                <option>Quarterly</option>
            </select>

            <label>Valid Until</label>
            <input type="date" required>

            <button type="submit">Apply for Bus Pass</button>
        </form>
    </div>
</body>

</html>
